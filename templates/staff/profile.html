{% extends "base.html" %}

{% block title %}Staff Profile - Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header">
                <h1 class="h5 mb-0">Update Staff Profile</h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input class="form-control" id="name" name="name" value="{{ staff.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="phone">Phone</label>
                            <input class="form-control" id="phone" name="phone" value="{{ staff.phone or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="experience_years">Experience Years</label>
                            <input class="form-control" id="experience_years" name="experience_years" type="number" min="0" value="{{ staff.staff_profile.experience_years if staff.staff_profile else 0 }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="contact_details">Contact Details</label>
                            <input class="form-control" id="contact_details" name="contact_details" value="{{ staff.staff_profile.contact_details if staff.staff_profile else '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="bio">Bio</label>
                        <textarea class="form-control" id="bio" name="bio" rows="4">{{ staff.staff_profile.bio if staff.staff_profile else '' }}</textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Save Profile</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('staff_dashboard') }}">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
