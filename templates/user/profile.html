{% extends "base.html" %}

{% block title %}User Profile - Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h1>Your Profile</h1>
                <p class="profile-subtitle">Manage your account details</p>
            </div>
            <div class="card-body">
                <form method="post" class="profile-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="name">Name</label>
                        <input class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" value="{{ user.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phone">Phone</label>
                        <input class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}">
                    </div>
                    <button class="btn btn-primary" type="submit">Save Profile</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('user.user_dashboard') }}">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
