{% extends "base.html" %}

{% block title %}
    {{ "Edit Staff" if edit_mode else "Add Staff" }} - Trekking Management
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header">
                <h1 class="h5 mb-0">
                    {{ "Edit Trek Staff" if edit_mode else "Add Trek Staff" }}
                </h1>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{ staff.name if edit_mode else '' }}"
                                required
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input
                                class="form-control"
                                id="email"
                                name="email"
                                type="email"
                                value="{{ staff.email if edit_mode else '' }}"
                                required
                            >
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="phone">Phone</label>
                            <input
                                class="form-control"
                                id="phone"
                                name="phone"
                                value="{{ staff.phone if edit_mode else '' }}"
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="experience_years">Experience Years</label>
                            <input
                                class="form-control"
                                id="experience_years"
                                name="experience_years"
                                type="number"
                                min="0"
                                value="{{ staff.staff_profile.experience_years if edit_mode else 0 }}"
                            >
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="contact_details">Additional Contact Details</label>
                        <input
                            class="form-control"
                            id="contact_details"
                            name="contact_details"
                            value="{{ staff.staff_profile.contact_details if edit_mode else '' }}"
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="bio">Bio</label>
                        <textarea
                            class="form-control"
                            id="bio"
                            name="bio"
                            rows="3"
                        >{{ staff.staff_profile.bio if edit_mode else '' }}</textarea>
                    </div>
                    {% if not edit_mode %}
                        <div class="mb-3">
                            <label class="form-label" for="password">Temporary Password</label>
                            <input
                                class="form-control"
                                id="password"
                                name="password"
                                type="password"
                                required
                            >
                        </div>
                    {% endif %}
                    <button class="btn btn-primary" type="submit">
                        {{ "Save Changes" if edit_mode else "Add Staff" }}
                    </button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('admin.admin_staff') }}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
