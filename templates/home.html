{% extends "base.html" %}

{% block title %}Home - Trekking Management{% endblock %}

{% block content %}
<div class="p-4 bg-white border rounded">
    <h1 class="h3">Trekking Management Application</h1>
    <p class="mb-3">Manage treks, staff approvals, bookings, and participant history using Flask and SQLite.</p>
    <a class="btn btn-primary" href="{{ url_for('login') }}">Login</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('register_user') }}">Register as Trekker</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('register_staff') }}">Register as Staff</a>
</div>
{% endblock %}
